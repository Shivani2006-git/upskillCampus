<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense Tracker App</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --danger: #ef4444;
      --success: #22c55e;
      --radius: 10px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 2rem 1rem; line-height: 1.5; }
    .container { max-width: 1100px; margin: 0 auto; display: grid; grid-template-columns: 1fr; gap: 1.5rem; }

    @media(min-width: 900px) {
      .container { grid-template-columns: 360px 1fr; }
      .full-width { grid-column: span 2; }
    }

    /* Cards */
    .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.5rem; }
    .card h2 { font-size: 1.25rem; margin-bottom: 1rem; border-bottom: 1px solid var(--border); padding-bottom: 0.5rem; color: #e2e8f0; }

    /* Alerts */
    .alert { padding: 0.75rem 1rem; border-radius: var(--radius); margin-bottom: 1rem; font-size: 0.9rem; display: none; }
    .alert.show { display: block; }
    .alert-success { background: rgba(34, 197, 94, 0.15); border: 1px solid var(--success); color: var(--success); }
    .alert-danger { background: rgba(239, 68, 68, 0.15); border: 1px solid var(--danger); color: var(--danger); }

    /* Forms & Controls */
    .form-group { margin-bottom: 1rem; }
    label { display: block; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 0.35rem; }
    input, select, textarea {
      width: 100%; padding: 0.65rem; background: #0f172a; border: 1px solid var(--border);
      border-radius: 6px; color: var(--text); font-size: 0.95rem; outline: none; transition: border-color 0.2s;
    }
    input:focus, select:focus, textarea:focus { border-color: var(--primary); }
    
    .btn {
      width: 100%; padding: 0.65rem; background: var(--primary); color: white; border: none;
      border-radius: 6px; font-weight: 600; cursor: pointer; transition: background 0.2s;
    }
    .btn:hover { background: var(--primary-hover); }
    .btn-secondary { background: var(--border); color: var(--text); }
    .btn-secondary:hover { background: #475569; }
    .btn-danger { background: var(--danger); }
    .btn-danger:hover { background: #dc2626; }
    .btn-group { display: flex; gap: 0.5rem; margin-top: 0.5rem; }

    /* Layout Utilities */
    .inline-fields { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; }

    /* Tables */
    .table-container { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; text-align: left; font-size: 0.9rem; }
    th, td { padding: 0.75rem; border-bottom: 1px solid var(--border); }
    th { color: var(--text-muted); font-weight: 600; }
    tbody tr:hover { background: rgba(255,255,255,0.02); }

    /* Summary & Reports */
    .summary-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 1rem; margin-bottom: 1.5rem; }
    .summary-card { background: rgba(255,255,255,0.03); border: 1px solid var(--border); padding: 1rem; border-radius: var(--radius); }
    .summary-card span { font-size: 0.8rem; color: var(--text-muted); display: block; }
    .summary-card strong { font-size: 1.4rem; color: #38bdf8; }

    /* Action Links */
    .action-btn { background: none; border: none; cursor: pointer; font-size: 0.85rem; padding: 0.2rem 0.4rem; border-radius: 4px; }
    .edit-btn { color: #38bdf8; }
    .delete-btn { color: var(--danger); }

    /* Category List Badges */
    .badge-list { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 1rem; }
    .badge { background: #334155; padding: 0.25rem 0.6rem; border-radius: 12px; font-size: 0.8rem; display: flex; align-items: center; gap: 0.5rem; }
    .badge button { background: none; border: none; color: var(--text-muted); cursor: pointer; font-weight: bold; }
    .badge button:hover { color: var(--danger); }
  </style>
</head>
<body>

  <div class="container">
    <div id="alertBox" class="alert full-width"></div>

    <!-- LEFT COLUMN: Forms -->
    <div style="display: flex; flex-direction: column; gap: 1.5rem;">
      
      <!-- Feature 1 & 5: Expense Recording / Editing -->
      <section class="card">
        <h2 id="formTitle">Record Expense</h2>
        <form id="expenseForm">
          <input type="hidden" id="expenseId">
          <div class="form-group">
            <label for="expAmount">Amount ($)</label>
            <input type="number" id="expAmount" step="0.01" min="0.01" placeholder="0.00" required>
          </div>
          <div class="form-group">
            <label for="expCategory">Category</label>
            <select id="expCategory" required></select>
          </div>
          <div class="form-group">
            <label for="expDate">Date</label>
            <input type="date" id="expDate" required>
          </div>
          <div class="form-group">
            <label for="expDesc">Description</label>
            <input type="text" id="expDesc" placeholder="e.g., Grocery shopping" required>
          </div>
          <button type="submit" id="saveBtn" class="btn">Save Expense</button>
          <button type="button" id="cancelEditBtn" class="btn btn-secondary" style="display:none; margin-top:0.5rem;">Cancel Edit</button>
        </form>
      </section>

      <!-- Feature 2: Expense Categories Management -->
      <section class="card">
        <h2>Manage Categories</h2>
        <form id="categoryForm">
          <div class="form-group">
            <input type="text" id="newCategory" placeholder="New category name" required>
          </div>
          <button type="submit" class="btn btn-secondary">Add Category</button>
        </form>
        <div id="categoryBadges" class="badge-list"></div>
      </section>

    </div>

    <!-- RIGHT COLUMN: Displays & Reports -->
    <div style="display: flex; flex-direction: column; gap: 1.5rem;">

      <!-- Feature 3 & 7: Summaries & Reports -->
      <section class="card">
        <h2>Spending Overview & Reports</h2>
        <div class="summary-grid">
          <div class="summary-card">
            <span>Total Spent</span>
            <strong id="statTotal">$0.00</strong>
          </div>
          <div class="summary-card">
            <span>Filter Total</span>
            <strong id="statFiltered">$0.00</strong>
          </div>
          <div class="summary-card">
            <span>Active Items</span>
            <strong id="statCount">0</strong>
          </div>
        </div>

        <div class="form-group">
          <label for="reportType">View Category Report</label>
          <select id="reportType" onchange="renderReports()">
            <option value="category">Category-wise Summary</option>
            <option value="monthly">Monthly Summary</option>
          </select>
        </div>
        <div id="reportContainer" class="table-container"></div>
      </section>

      <!-- Feature 4 & 5: Filtering & Expense List -->
      <section class="card">
        <h2>Filtered Expenses</h2>
        
        <div class="inline-fields" style="margin-bottom: 1rem;">
          <div>
            <label for="filterCategory">Category</label>
            <select id="filterCategory">
              <option value="ALL">All Categories</option>
            </select>
          </div>
          <div>
            <label for="filterMonth">Month</label>
            <input type="month" id="filterMonth">
          </div>
        </div>
        <button id="resetFilters" class="btn btn-secondary" style="margin-bottom: 1rem;">Clear Filters</button>

        <div class="table-container">
          <table>
            <thead>
              <tr>
                <th>Date</th>
                <th>Category</th>
                <th>Description</th>
                <th>Amount</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="expenseTableBody">
              <!-- Expense rows render here -->
            </tbody>
          </table>
        </div>
      </section>

    </div>
  </div>

  <script>
    // App State initialized with Feature 6: Data Persistence
    let categories = JSON.parse(localStorage.getItem('et_categories')) || ['Food', 'Transportation', 'Housing', 'Utilities', 'Entertainment'];
    let expenses = JSON.parse(localStorage.getItem('et_expenses')) || [];

    // DOM Elements
    const expenseForm = document.getElementById('expenseForm');
    const categoryForm = document.getElementById('categoryForm');
    const alertBox = document.getElementById('alertBox');

    // App Initialization
    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('expDate').valueAsDate = new Date();
      updateCategoryDropdowns();
      renderCategoryBadges();
      renderAll();

      // Event Listeners
      expenseForm.addEventListener('submit', handleExpenseSubmit);
      categoryForm.addEventListener('submit', handleCategorySubmit);
      document.getElementById('filterCategory').addEventListener('change', renderAll);
      document.getElementById('filterMonth').addEventListener('change', renderAll);
      document.getElementById('resetFilters').addEventListener('click', () => {
        document.getElementById('filterCategory').value = 'ALL';
        document.getElementById('filterMonth').value = '';
        renderAll();
      });
      document.getElementById('cancelEditBtn').addEventListener('click', resetForm);
    });

    // Feature 9: Error Handling & Notifications
    function showAlert(msg, isError = false) {
      alertBox.textContent = msg;
      alertBox.className = `alert show ${isError ? 'alert-danger' : 'alert-success'}`;
      setTimeout(() => alertBox.classList.remove('show'), 3500);
    }

    // Save Data to Storage (Feature 6)
    function persistData() {
      localStorage.setItem('et_categories', JSON.stringify(categories));
      localStorage.setItem('et_expenses', JSON.stringify(expenses));
      renderAll();
    }

    // Feature 2: Expense Categories Management
    function updateCategoryDropdowns() {
      const selectExp = document.getElementById('expCategory');
      const selectFilter = document.getElementById('filterCategory');
      
      const currentFilter = selectFilter.value;
      const currentExp = selectExp.value;

      selectExp.innerHTML = categories.map(c => `<option value="${c}">${c}</option>`).join('');
      selectFilter.innerHTML = `<option value="ALL">All Categories</option>` + 
        categories.map(c => `<option value="${c}">${c}</option>`).join('');

      selectFilter.value = currentFilter;
      selectExp.value = currentExp || categories[0] || '';
    }

    function renderCategoryBadges() {
      const container = document.getElementById('categoryBadges');
      container.innerHTML = categories.map(cat => `
        <span class="badge">
          ${cat}
          <button onclick="deleteCategory('${cat}')" title="Delete Category">&times;</button>
        </span>
      `).join('');
    }

    function handleCategorySubmit(e) {
      e.preventDefault();
      const input = document.getElementById('newCategory');
      const val = input.value.trim();

      if (!val) return showAlert('Category name cannot be empty', true);
      if (categories.some(c => c.toLowerCase() === val.toLowerCase())) {
        return showAlert('Category already exists', true);
      }

      categories.push(val);
      input.value = '';
      persistData();
      updateCategoryDropdowns();
      renderCategoryBadges();
      showAlert(`Category "${val}" added successfully!`);
    }

    function deleteCategory(catName) {
      if (expenses.some(e => e.category === catName)) {
        return showAlert(`Cannot remove "${catName}" because existing expenses use it.`, true);
      }
      categories = categories.filter(c => c !== catName);
      persistData();
      updateCategoryDropdowns();
      renderCategoryBadges();
      showAlert(`Category "${catName}" removed.`);
    }

    // Feature 1 & 5: Add, Edit, and Save Expenses
    function handleExpenseSubmit(e) {
      e.preventDefault();
      
      const id = document.getElementById('expenseId').value;
      const amount = parseFloat(document.getElementById('expAmount').value);
      const category = document.getElementById('expCategory').value;
      const date = document.getElementById('expDate').value;
      const description = document.getElementById('expDesc').value.trim();

      // Feature 9: Validation
      if (isNaN(amount) || amount <= 0) return showAlert('Please enter a valid amount greater than 0', true);
      if (!category) return showAlert('Please select a category', true);
      if (!date) return showAlert('Please select a date', true);
      if (!description) return showAlert('Please enter a description', true);

      if (id) {
        // Edit Existing (Feature 5)
        const idx = expenses.findIndex(exp => exp.id === id);
        if (idx !== -1) {
          expenses[idx] = { id, amount, category, date, description };
          showAlert('Expense updated successfully!');
        }
      } else {
        // Create New (Feature 1)
        const newExp = {
          id: Date.now().toString(),
          amount, category, date, description
        };
        expenses.push(newExp);
        showAlert('Expense recorded successfully!');
      }

      resetForm();
      persistData();
    }

    function editExpense(id) {
      const exp = expenses.find(e => e.id === id);
      if (!exp) return;

      document.getElementById('expenseId').value = exp.id;
      document.getElementById('expAmount').value = exp.amount;
      document.getElementById('expCategory').value = exp.category;
      document.getElementById('expDate').value = exp.date;
      document.getElementById('expDesc').value = exp.description;

      document.getElementById('formTitle').textContent = 'Edit Expense';
      document.getElementById('saveBtn').textContent = 'Update Expense';
      document.getElementById('cancelEditBtn').style.display = 'block';
    }

    function deleteExpense(id) {
      if (confirm('Are you sure you want to delete this expense?')) {
        expenses = expenses.filter(e => e.id !== id);
        persistData();
        showAlert('Expense deleted successfully!');
      }
    }

    function resetForm() {
      document.getElementById('expenseId').value = '';
      expenseForm.reset();
      document.getElementById('expDate').valueAsDate = new Date();
      document.getElementById('formTitle').textContent = 'Record Expense';
      document.getElementById('saveBtn').textContent = 'Save Expense';
      document.getElementById('cancelEditBtn').style.display = 'none';
    }

    // Feature 4: Filtering Mechanism
    function getFilteredExpenses() {
      const cat = document.getElementById('filterCategory').value;
      const month = document.getElementById('filterMonth').value;

      return expenses.filter(exp => {
        const matchesCategory = (cat === 'ALL' || exp.category === cat);
        const matchesMonth = (!month || exp.date.startsWith(month));
        return matchesCategory && matchesMonth;
      });
    }

    // Feature 3, 4, 7 & 8: Rendering Logic
    function renderAll() {
      renderExpenseTable();
      renderReports();
    }

    function renderExpenseTable() {
      const tbody = document.getElementById('expenseTableBody');
      const filtered = getFilteredExpenses();

      // Sort by date descending
      filtered.sort((a, b) => new Date(b.date) - new Date(a.date));

      if (filtered.length === 0) {
        tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; color:var(--text-muted);">No records found.</td></tr>`;
        return;
      }

      tbody.innerHTML = filtered.map(exp => `
        <tr>
          <td>${exp.date}</td>
          <td><span class="badge" style="display:inline-block">${exp.category}</span></td>
          <td>${escapeHtml(exp.description)}</td>
          <td><strong>$${exp.amount.toFixed(2)}</strong></td>
          <td>
            <button class="action-btn edit-btn" onclick="editExpense('${exp.id}')">Edit</button>
            <button class="action-btn delete-btn" onclick="deleteExpense('${exp.id}')">Delete</button>
          </td>
        </tr>
      `).join('');
    }

    // Feature 7: Reports Generation
    function renderReports() {
      const filtered = getFilteredExpenses();
      const totalAll = expenses.reduce((acc, curr) => acc + curr.amount, 0);
      const totalFiltered = filtered.reduce((acc, curr) => acc + curr.amount, 0);

      document.getElementById('statTotal').textContent = `$${totalAll.toFixed(2)}`;
      document.getElementById('statFiltered').textContent = `$${totalFiltered.toFixed(2)}`;
      document.getElementById('statCount').textContent = filtered.length;

      const reportType = document.getElementById('reportType').value;
      const container = document.getElementById('reportContainer');

      if (reportType === 'category') {
        const catMap = {};
        filtered.forEach(e => {
          catMap[e.category] = (catMap[e.category] || 0) + e.amount;
        });

        const rows = Object.keys(catMap).map(cat => {
          const amt = catMap[cat];
          const pct = totalFiltered > 0 ? ((amt / totalFiltered) * 100).toFixed(1) : 0;
          return `
            <tr>
              <td>${cat}</td>
              <td>$${amt.toFixed(2)}</td>
              <td>${pct}%</td>
            </tr>`;
        }).join('');

        container.innerHTML = `
          <table>
            <thead>
              <tr><th>Category</th><th>Total Amount</th><th>Share</th></tr>
            </thead>
            <tbody>
              ${rows || '<tr><td colspan="3" style="text-align:center; color:var(--text-muted);">No data</td></tr>'}
            </tbody>
          </table>`;
      } else {
        // Monthly Report
        const monthMap = {};
        filtered.forEach(e => {
          const key = e.date.substring(0, 7); // YYYY-MM
          monthMap[key] = (monthMap[key] || 0) + e.amount;
        });

        const rows = Object.keys(monthMap).sort().reverse().map(m => `
          <tr>
            <td>${m}</td>
            <td>$${monthMap[m].toFixed(2)}</td>
          </tr>
        `).join('');

        container.innerHTML = `
          <table>
            <thead>
              <tr><th>Month</th><th>Total Spent</th></tr>
            </thead>
            <tbody>
              ${rows || '<tr><td colspan="2" style="text-align:center; color:var(--text-muted);">No data</td></tr>'}
            </tbody>
          </table>`;
      }
    }

    // Utility
    function escapeHtml(str) {
      return str.replace(/[&<>"']/g, match => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      })[match]);
    }
  </script>
</body>
</html>
