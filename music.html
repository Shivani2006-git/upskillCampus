<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PulseAudio - Music Player Application</title>
  <style>
    :root {
      --bg-primary: #121212;
      --bg-secondary: #1e1e1e;
      --bg-tertiary: #2a2a2a;
      --accent: #1db954;
      --accent-hover: #1ed760;
      --text-main: #ffffff;
      --text-sub: #b3b3b3;
      --border-color: #333333;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    body {
      background-color: var(--bg-primary);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* Top Layout */
    .app-container {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* Sidebar Navigation */
    .sidebar {
      width: 260px;
      background-color: #000000;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      border-right: 1px solid var(--border-color);
    }

    .brand {
      font-size: 1.4rem;
      font-weight: bold;
      color: var(--accent);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .nav-section {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .nav-section h3 {
      font-size: 0.75rem;
      text-transform: uppercase;
      color: var(--text-sub);
      letter-spacing: 1px;
    }

    .btn-import {
      background-color: var(--accent);
      color: #000;
      font-weight: bold;
      padding: 10px 15px;
      border-radius: 20px;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background 0.2s;
    }

    .btn-import:hover {
      background-color: var(--accent-hover);
    }

    .playlist-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
      overflow-y: auto;
    }

    .playlist-item {
      padding: 8px 12px;
      border-radius: 4px;
      color: var(--text-sub);
      cursor: pointer;
      font-size: 0.9rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .playlist-item:hover, .playlist-item.active {
      background-color: var(--bg-tertiary);
      color: var(--text-main);
    }

    /* Main Content Area */
    .main-content {
      flex: 1;
      background-color: var(--bg-primary);
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      padding: 24px;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      gap: 16px;
    }

    .search-bar {
      background-color: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 8px 16px;
      color: var(--text-main);
      width: 300px;
      outline: none;
    }

    .search-bar:focus {
      border-color: var(--accent);
    }

    .tab-group {
      display: flex;
      gap: 10px;
    }

    .tab-btn {
      background: none;
      border: none;
      color: var(--text-sub);
      font-size: 0.9rem;
      padding: 6px 12px;
      cursor: pointer;
      border-radius: 12px;
    }

    .tab-btn.active {
      background-color: var(--bg-tertiary);
      color: var(--text-main);
    }

    /* Songs Table */
    .song-list {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    .song-list th {
      color: var(--text-sub);
      font-size: 0.8rem;
      border-bottom: 1px solid var(--border-color);
      padding: 10px;
      text-transform: uppercase;
    }

    .song-list td {
      padding: 12px 10px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      font-size: 0.9rem;
    }

    .song-row {
      cursor: pointer;
    }

    .song-row:hover {
      background-color: var(--bg-secondary);
    }

    .song-row.playing {
      color: var(--accent);
    }

    /* Audio Equalizer Overlay / Modal */
    .eq-panel {
      background-color: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 20px;
      display: none;
    }

    .eq-panel.visible {
      display: block;
    }

    .eq-sliders {
      display: flex;
      gap: 20px;
      margin-top: 12px;
      align-items: center;
    }

    .eq-slider-group {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      font-size: 0.75rem;
      color: var(--text-sub);
    }

    .eq-slider-group input[type=range] {
      writing-mode: bt-lr;
      appearance: slider-vertical;
      width: 8px;
      height: 100px;
    }

    /* Bottom Control Bar */
    .player-bar {
      height: 90px;
      background-color: var(--bg-secondary);
      border-top: 1px solid var(--border-color);
      display: grid;
      grid-template-columns: 1fr 2fr 1fr;
      align-items: center;
      padding: 0 20px;
    }

    /* Track Info */
    .now-playing {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .album-art {
      width: 56px;
      height: 56px;
      background-color: var(--bg-tertiary);
      border-radius: 4px;
      object-fit: cover;
    }

    .track-details {
      display: flex;
      flex-direction: column;
      gap: 4px;
      overflow: hidden;
    }

    .track-title {
      font-size: 0.9rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .track-artist {
      font-size: 0.8rem;
      color: var(--text-sub);
    }

    /* Playback Controls */
    .controls-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .control-buttons {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .btn-icon {
      background: none;
      border: none;
      color: var(--text-sub);
      cursor: pointer;
      font-size: 1.1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.2s;
    }

    .btn-icon:hover, .btn-icon.active {
      color: var(--text-main);
    }

    .btn-play {
      background-color: var(--text-main);
      color: #000;
      border-radius: 50%;
      width: 36px;
      height: 36px;
      font-size: 1rem;
    }

    .btn-play:hover {
      transform: scale(1.05);
      background-color: #ffffff;
      color: #000;
    }

    .progress-container {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      max-width: 500px;
      font-size: 0.75rem;
      color: var(--text-sub);
    }

    .progress-bar {
      flex: 1;
      height: 4px;
      border-radius: 2px;
      appearance: none;
      background: var(--bg-tertiary);
      outline: none;
      cursor: pointer;
    }

    .progress-bar::-webkit-slider-thumb {
      appearance: none;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--accent);
      cursor: pointer;
    }

    /* Right Controls */
    .right-controls {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 12px;
    }

    .volume-bar {
      width: 100px;
      height: 4px;
      appearance: none;
      background: var(--bg-tertiary);
      border-radius: 2px;
      outline: none;
      cursor: pointer;
    }

    .volume-bar::-webkit-slider-thumb {
      appearance: none;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--text-main);
    }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="brand">
        <span>🎵</span> PulseAudio
      </div>
      
      <button class="btn-import" onclick="document.getElementById('file-input').click()">
        <span>+</span> Import Audio
      </button>
      <input type="file" id="file-input" multiple accept="audio/mp3,audio/wav,audio/flac,audio/*" style="display: none;">

      <div class="nav-section">
        <h3>Library</h3>
        <ul class="playlist-list">
          <li class="playlist-item active" onclick="switchView('all')">All Tracks</li>
        </ul>
      </div>

      <div class="nav-section">
        <h3>Playlists</h3>
        <button class="btn-icon" style="justify-content: flex-start; font-size: 0.85rem; padding: 4px 0;" onclick="createPlaylist()">
          + Create Playlist
        </button>
        <ul class="playlist-list" id="playlist-container">
          <!-- Dynamic Playlists -->
        </ul>
      </div>
    </aside>

    <!-- Main Content Area -->
    <main class="main-content">
      <div class="top-bar">
        <input type="text" id="search-input" class="search-bar" placeholder="Search tracks or artists..." oninput="filterTracks()">
        <div class="tab-group">
          <button class="tab-btn" onclick="toggleEqualizer()">Equalizer 🎚️</button>
        </div>
      </div>

      <!-- Equalizer Box -->
      <div class="eq-panel" id="eq-panel">
        <h4>Audio Equalizer</h4>
        <div class="eq-sliders">
          <div class="eq-slider-group">
            <input type="range" id="eq-60" min="-12" max="12" value="0" onchange="updateEQ(0, this.value)">
            <label>60Hz</label>
          </div>
          <div class="eq-slider-group">
            <input type="range" id="eq-310" min="-12" max="12" value="0" onchange="updateEQ(1, this.value)">
            <label>310Hz</label>
          </div>
          <div class="eq-slider-group">
            <input type="range" id="eq-1k" min="-12" max="12" value="0" onchange="updateEQ(2, this.value)">
            <label>1kHz</label>
          </div>
          <div class="eq-slider-group">
            <input type="range" id="eq-3k" min="-12" max="12" value="0" onchange="updateEQ(3, this.value)">
            <label>3kHz</label>
          </div>
          <div class="eq-slider-group">
            <input type="range" id="eq-12k" min="-12" max="12" value="0" onchange="updateEQ(4, this.value)">
            <label>12kHz</label>
          </div>
        </div>
      </div>

      <!-- Track List Table -->
      <table class="song-list">
        <thead>
          <tr>
            <th>#</th>
            <th>Title</th>
            <th>Artist</th>
            <th>Format</th>
            <th>Duration</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="track-table-body">
          <!-- Dynamic Tracks -->
        </tbody>
      </table>
    </main>
  </div>

  <!-- Bottom Player Bar -->
  <footer class="player-bar">
    <div class="now-playing">
      <img id="album-art" class="album-art" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='56' height='56' fill='%232a2a2a'><rect width='56' height='56'/><text x='50%' y='50%' dominant-baseline='middle' text-anchor='middle' fill='%23b3b3b3' font-size='20'>🎵</text></svg>" alt="Album Art">
      <div class="track-details">
        <div id="track-title" class="track-title">No Track Selected</div>
        <div id="track-artist" class="track-artist">--</div>
      </div>
    </div>

    <div class="controls-container">
      <div class="control-buttons">
        <button class="btn-icon" id="shuffle-btn" onclick="toggleShuffle()" title="Shuffle">🔀</button>
        <button class="btn-icon" onclick="playPrevious()" title="Previous">⏮</button>
        <button class="btn-icon btn-play" id="play-btn" onclick="togglePlay()" title="Play/Pause">▶</button>
        <button class="btn-icon" onclick="playNext()" title="Next">⏭</button>
        <button class="btn-icon" id="repeat-btn" onclick="toggleRepeat()" title="Repeat">🔁</button>
      </div>

      <div class="progress-container">
        <span id="current-time">0:00</span>
        <input type="range" id="seek-bar" class="progress-bar" value="0" min="0" max="100" oninput="seekTrack(this.value)">
        <span id="total-duration">0:00</span>
      </div>
    </div>

    <div class="right-controls">
      <span class="btn-icon">🔊</span>
      <input type="range" id="volume-bar" class="volume-bar" value="100" min="0" max="100" oninput="setVolume(this.value)">
    </div>
  </footer>

  <script>
    // Application State
    let library = [];
    let playlists = {};
    let currentPlaylistKey = 'all';
    let currentTrackIndex = -1;
    let isPlaying = false;
    let isShuffle = false;
    let isRepeat = false;

    // Web Audio API Elements
    let audioCtx = null;
    let audioElement = new Audio();
    let sourceNode = null;
    let eqFilters = [];

    // DOM Elements
    const fileInput = document.getElementById('file-input');
    const trackTableBody = document.getElementById('track-table-body');
    const playBtn = document.getElementById('play-btn');
    const trackTitle = document.getElementById('track-title');
    const trackArtist = document.getElementById('track-artist');
    const albumArt = document.getElementById('album-art');
    const seekBar = document.getElementById('seek-bar');
    const currentTimeEl = document.getElementById('current-time');
    const totalDurationEl = document.getElementById('total-duration');
    const volumeBar = document.getElementById('volume-bar');

    // Initialize Audio Context and Equalizer
    function initAudioContext() {
      if (!audioCtx) {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContext();
        sourceNode = audioCtx.createMediaElementSource(audioElement);

        // Standard 5-band EQ frequencies
        const frequencies = [60, 310, 1000, 3000, 12000];
        let previousNode = sourceNode;

        frequencies.forEach((freq) => {
          const filter = audioCtx.createBiquadFilter();
          filter.type = 'peaking';
          filter.frequency.value = freq;
          filter.Q.value = 1.0;
          filter.gain.value = 0;
          
          previousNode.connect(filter);
          previousNode = filter;
          eqFilters.push(filter);
        });

        previousNode.connect(audioCtx.destination);
      }
    }

    // Handle File Imports
    fileInput.addEventListener('change', (e) => {
      const files = Array.from(e.target.files);
      
      files.forEach((file) => {
        const url = URL.createObjectURL(file);
        const format = file.name.split('.').pop().toUpperCase();
        
        // Basic Metadata Extraction from Filename
        const fileNameWithoutExt = file.name.replace(/\.[^/.]+$/, "");
        const parts = fileNameWithoutExt.split('-');
        let title = fileNameWithoutExt;
        let artist = 'Unknown Artist';

        if (parts.length > 1) {
          artist = parts[0].trim();
          title = parts.slice(1).join('-').trim();
        }

        const track = {
          id: Date.now() + Math.random(),
          title: title,
          artist: artist,
          format: format,
          url: url,
          duration: 0
        };

        library.push(track);
      });

      renderTracks();
    });

    // Render Track Table
    function renderTracks(tracksToRender = null) {
      const activeList = tracksToRender || getActiveTrackList();
      trackTableBody.innerHTML = '';

      if (activeList.length === 0) {
        trackTableBody.innerHTML = `<tr><td colspan="6" style="text-align:center; color: var(--text-sub); padding: 20px;">No tracks available. Import songs to get started!</td></tr>`;
        return;
      }

      activeList.forEach((track, idx) => {
        const tr = document.createElement('tr');
        tr.className = `song-row ${currentTrackIndex === idx ? 'playing' : ''}`;
        
        tr.innerHTML = `
          <td>${idx + 1}</td>
          <td><strong>${track.title}</strong></td>
          <td>${track.artist}</td>
          <td>${track.format}</td>
          <td id="duration-${idx}">--:--</td>
          <td>
            <button class="btn-icon" title="Add to Playlist" onclick="event.stopPropagation(); promptAddToPlaylist('${track.id}')">➕</button>
          </td>
        `;

        tr.onclick = () => playTrack(idx);
        trackTableBody.appendChild(tr);

        // Fetch duration asynchronously
        const tempAudio = new Audio(track.url);
        tempAudio.onloadedmetadata = () => {
          track.duration = tempAudio.duration;
          const durEl = document.getElementById(`duration-${idx}`);
          if (durEl) durEl.textContent = formatTime(tempAudio.duration);
        };
      });
    }

    function getActiveTrackList() {
      if (currentPlaylistKey === 'all') return library;
      return playlists[currentPlaylistKey] || [];
    }

    // Audio Playback Engine
    function playTrack(index) {
      const activeList = getActiveTrackList();
      if (index < 0 || index >= activeList.length) return;

      initAudioContext();
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }

      currentTrackIndex = index;
      const track = activeList[index];

      audioElement.src = track.url;
      audioElement.play();
      isPlaying = true;

      trackTitle.textContent = track.title;
      trackArtist.textContent = track.artist;
      playBtn.textContent = '⏸';

      renderTracks();
    }

    function togglePlay() {
      if (currentTrackIndex === -1 && getActiveTrackList().length > 0) {
        playTrack(0);
        return;
      }

      if (isPlaying) {
        audioElement.pause();
        playBtn.textContent = '▶';
      } else {
        audioElement.play();
        playBtn.textContent = '⏸';
      }
      isPlaying = !isPlaying;
    }

    function playNext() {
      const activeList = getActiveTrackList();
      if (activeList.length === 0) return;

      if (isShuffle) {
        const randomIndex = Math.floor(Math.random() * activeList.length);
        playTrack(randomIndex);
      } else {
        const nextIndex = (currentTrackIndex + 1) % activeList.length;
        playTrack(nextIndex);
      }
    }

    function playPrevious() {
      const activeList = getActiveTrackList();
      if (activeList.length === 0) return;

      const prevIndex = (currentTrackIndex - 1 + activeList.length) % activeList.length;
      playTrack(prevIndex);
    }

    // Audio Control Listeners
    audioElement.ontimeupdate = () => {
      if (!audioElement.duration) return;
      const progress = (audioElement.currentTime / audioElement.duration) * 100;
      seekBar.value = progress;
      currentTimeEl.textContent = formatTime(audioElement.currentTime);
      totalDurationEl.textContent = formatTime(audioElement.duration);
    };

    audioElement.onended = () => {
      if (isRepeat) {
        audioElement.currentTime = 0;
        audioElement.play();
      } else {
        playNext();
      }
    };

    function seekTrack(value) {
      if (audioElement.duration) {
        audioElement.currentTime = (value / 100) * audioElement.duration;
      }
    }

    function setVolume(value) {
      audioElement.volume = value / 100;
    }

    function toggleShuffle() {
      isShuffle = !isShuffle;
      document.getElementById('shuffle-btn').classList.toggle('active', isShuffle);
    }

    function toggleRepeat() {
      isRepeat = !isRepeat;
      document.getElementById('repeat-btn').classList.toggle('active', isRepeat);
    }

    // Playlist Management
    function createPlaylist() {
      const name = prompt("Enter Playlist Name:");
      if (name && !playlists[name]) {
        playlists[name] = [];
        renderPlaylists();
      }
    }

    function renderPlaylists() {
      const container = document.getElementById('playlist-container');
      container.innerHTML = '';
      
      Object.keys(playlists).forEach(name => {
        const li = document.createElement('li');
        li.className = `playlist-item ${currentPlaylistKey === name ? 'active' : ''}`;
        li.textContent = name;
        li.onclick = () => switchView(name);
        container.appendChild(li);
      });
    }

    function switchView(key) {
      currentPlaylistKey = key;
      document.querySelectorAll('.playlist-item').forEach(el => el.classList.remove('active'));
      renderTracks();
    }

    function promptAddToPlaylist(trackId) {
      const playlistNames = Object.keys(playlists);
      if (playlistNames.length === 0) {
        alert("Create a playlist first!");
        return;
      }
      
      const target = prompt(`Add to playlist:\nAvailable: ${playlistNames.join(', ')}`);
      if (target && playlists[target]) {
        const track = library.find(t => t.id == trackId);
        if (track && !playlists[target].includes(track)) {
          playlists[target].push(track);
          alert(`Added to "${target}"`);
        }
      }
    }

    // Search and Filter
    function filterTracks() {
      const query = document.getElementById('search-input').value.toLowerCase();
      const activeList = getActiveTrackList();
      
      const filtered = activeList.filter(track => 
        track.title.toLowerCase().includes(query) || 
        track.artist.toLowerCase().includes(query)
      );
      
      renderTracks(filtered);
    }

    // Equalizer Adjustments
    function toggleEqualizer() {
      const panel = document.getElementById('eq-panel');
      panel.classList.toggle('visible');
    }

    function updateEQ(bandIndex, gainValue) {
      if (eqFilters[bandIndex]) {
        eqFilters[bandIndex].gain.value = parseFloat(gainValue);
      }
    }

    // Helper Utility
    function formatTime(seconds) {
      const mins = Math.floor(seconds / 60);
      const secs = Math.floor(seconds % 60);
      return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
    }
  </script>
</body>
</html>
